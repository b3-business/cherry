name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing (dry-run)"
        required: false
        default: "false"
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check
        working-directory: packages/cherry

      - name: Run tests
        run: bun test
        working-directory: packages/cherry

      - name: Build
        run: bun run build
        working-directory: packages/cherry

      - name: Publish to npm (dry-run)
        if: inputs.dry-run == 'true'
        run: npm publish --dry-run --provenance --access public
        working-directory: packages/cherry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: inputs.dry-run != 'true'
        run: npm publish --provenance --access public
        working-directory: packages/cherry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
